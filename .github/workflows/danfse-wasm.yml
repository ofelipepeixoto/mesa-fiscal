name: Compilar gerador de DANFSe para o navegador
on:
  workflow_dispatch:
    inputs:
      registrar_binario:
        description: Preparar o objeto Git do motor compactado para a publicação do Mesa Fiscal
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compilar:
    uses: ./.github/workflows/danfse-build.yml

  registrar:
    if: github.event_name == 'workflow_dispatch' && inputs.registrar_binario
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verificar o binário e preparar seu objeto Git
        env:
          GH_TOKEN: ${{ github.token }}
          MOTOR_SHA256: ${{ needs.compilar.outputs.motor_sha256 }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name motor-danfse-browser --dir engine
          cd engine
          test -f danfse.wasm.gz && test ! -L danfse.wasm.gz
          test "$(stat -c %s danfse.wasm.gz)" -le 33554432
          [[ "$MOTOR_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual=$(sha256sum danfse.wasm.gz | cut -d' ' -f1)
          test "$actual" = "$MOTOR_SHA256"
          git init -q "$RUNNER_TEMP/hash"
          expected=$(git -C "$RUNNER_TEMP/hash" hash-object --stdin < danfse.wasm.gz)
          jq -Rs '{encoding:"base64",content:.}' < <(base64 -w 0 danfse.wasm.gz) > "$RUNNER_TEMP/blob.json"
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
          test "$sha" = "$expected"
          printf 'Objeto Git compactado: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
