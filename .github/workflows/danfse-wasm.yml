name: Compilar gerador de DANFSe para o navegador
on:
  workflow_dispatch:
    inputs:
      registrar_binario:
        description: Preparar o objeto Git do motor compactado para a publicação do Mesa Fiscal
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter a revisão oficial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ReceitaFederal/calculadora-rtc-gerador-danfse
          ref: 8d79e6b2f7fad6375340afcb51c85ed370c64a14
          persist-credentials: false

      - name: Preparar Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.4'
          cache: false

      - name: Compilar e reunir as licenças
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/engine"
          mkdir -p "$out"
          go build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$out/danfse.wasm" ./cmd/danfse-wasm
          go mod verify
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" "$out/"
          cp "$(go env GOROOT)/LICENSE" "$out/LICENSE-Go.txt"
          cp LICENSE "$out/LICENSE-DANFSe.txt"
          go list -deps -mod=readonly -f '{{with .Module}}{{.Path}}|{{.Dir}}{{end}}' ./cmd/danfse-wasm | sort -u > "$RUNNER_TEMP/modules"
          while IFS='|' read -r mod dir; do
            if [ -z "$dir" ] || [ "$mod" = "danfse-service" ]; then continue; fi
            printf '\n============ %s ============\n' "$mod"
            find "$dir" -maxdepth 2 -type f \( -iname 'license*' -o -iname 'notice*' -o -iname 'copying*' \) -print0 | sort -z | xargs -0 -r cat
          done < "$RUNNER_TEMP/modules" > "$out/THIRD-PARTY.txt"
          go version > "$out/BUILD.txt"
          go list -deps -mod=readonly -f '{{with .Module}}{{.Path}} {{.Version}}{{end}}' ./cmd/danfse-wasm | sort -u >> "$out/BUILD.txt"
          printf 'Fonte: https://github.com/ReceitaFederal/calculadora-rtc-gerador-danfse/commit/%s\n' "$(git rev-parse HEAD)" >> "$out/BUILD.txt"
          cd "$out"
          sha256sum danfse.wasm >> BUILD.txt
          gzip -9 -n danfse.wasm
          sha256sum BUILD.txt LICENSE-*.txt THIRD-PARTY.txt danfse.wasm.gz wasm_exec.js > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Disponibilizar o motor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motor-danfse-browser
          path: ${{ runner.temp }}/engine/
          if-no-files-found: error
          retention-days: 7

  registrar:
    if: github.event_name == 'workflow_dispatch' && inputs.registrar_binario
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verificar o binário e preparar seu objeto Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name motor-danfse-browser --dir engine
          cd engine
          sha256sum -c SHA256SUMS
          git init -q "$RUNNER_TEMP/hash"
          expected=$(git -C "$RUNNER_TEMP/hash" hash-object --stdin < danfse.wasm.gz)
          jq -Rs '{encoding:"base64",content:.}' < <(base64 -w 0 danfse.wasm.gz) > "$RUNNER_TEMP/blob.json"
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
          test "$sha" = "$expected"
          printf 'Objeto Git compactado: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
