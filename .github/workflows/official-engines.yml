name: Homologar os três motores oficiais

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-engines.yml'
      - 'compose.yaml'
      - 'Dockerfile'
      - 'deploy/**'
      - 'server/**'
      - 'server.mjs'
      - 'scripts/verify-engines.mjs'
      - 'public/regular-study.mjs'
      - 'public/simples-study.mjs'
      - 'public/exemplo-nfse.xml'
      - 'public/danfse-*'
      - 'public/flows.mjs'
      - 'public/assistente.mjs'
      - 'public/app.mjs'
      - 'public/styles.css'
      - 'test/**'
      - 'public/engine/**'
      - 'scripts/testar-danfse-navegador.mjs'

permissions:
  contents: read

concurrency:
  group: homologar-motores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter a revisão em teste
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar contratos e versão estática
        run: |
          node --test test/*.test.mjs
          node scripts/build.mjs
          node scripts/testar-motor-wasm.mjs
      - name: Gerar o PDF no Chrome sem enviar o XML
        run: |
          chromedriver --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:9515/status > /dev/null
          node scripts/testar-danfse-navegador.mjs
  motores:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Obter a revisão em teste
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar o construtor
        run: |
          docker compose version
          docker buildx create --name mesa-fiscal-ci --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Construir e iniciar os motores e a interface
        env:
          BUILDX_BUILDER: mesa-fiscal-ci
        run: docker compose up -d --build
      - name: Conferir resultados pela interface HTTP
        run: node scripts/verify-engines.mjs
      - name: Examinar serviços em caso de falha
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Encerrar os serviços do teste
        if: always()
        run: docker compose down --volumes --remove-orphans
