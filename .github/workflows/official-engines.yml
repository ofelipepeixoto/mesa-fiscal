name: Homologar os três motores oficiais

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-engines.yml'
      - '.github/workflows/danfse-wasm.yml'
      - '.github/workflows/danfse-build.yml'
      - 'compose.yaml'
      - 'upstream.lock.env'
      - 'scripts/upstreams.mjs'
      - 'package*.json'
      - 'scripts/build.mjs'
      - 'public/**'
      - 'Dockerfile'
      - 'deploy/**'
      - 'server/**'
      - 'server.mjs'
      - 'scripts/verify-engines.mjs'
      - 'scripts/verificar-logs-ci.mjs'
      - 'test/**'
      - 'scripts/testar-danfse-navegador.mjs'
      - 'scripts/testar-danfse-nt009.mjs'
      - 'scripts/compilar-danfse.sh'
      - 'scripts/verificar-distribuicao-danfse.mjs'

permissions:
  contents: read

concurrency:
  group: homologar-motores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  danfse:
    uses: ./.github/workflows/danfse-build.yml
    with:
      conferir_distribuicao: true
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter a revisão em teste
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar contratos e versão estática
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm audit --include=dev --audit-level=high --registry=https://registry.npmjs.org
          node scripts/upstreams.mjs verify
          (cd public/engine && sha256sum -c SHA256SUMS)
          node --test test/*.test.mjs
          node scripts/build.mjs
          node scripts/testar-motor-wasm.mjs
      - name: Gerar o PDF no Chrome sem enviar o XML
        run: |
          chromedriver --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:9515/status > /dev/null
          node scripts/testar-danfse-navegador.mjs
          node scripts/testar-danfse-navegador.mjs --dist
  motores:
    needs: danfse
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Exigir a recompilação e a análise Go
        if: needs.danfse.result != 'success'
        run: exit 1
      - name: Obter a revisão em teste
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar o construtor
        run: |
          docker compose version
          docker buildx create --name mesa-fiscal-ci --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Construir e iniciar os motores e a interface
        env:
          BUILDX_BUILDER: mesa-fiscal-ci
        run: docker compose up -d --build
      - name: Conferir resultados pela interface HTTP
        run: node scripts/verify-engines.mjs
      - name: Conferir os campos do PDF pela interface HTTP
        run: |
          command -v pdftotext || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
          node scripts/testar-danfse-nt009.mjs --http
      - name: Conferir a privacidade do XML nos registros locais
        id: privacidade
        run: node scripts/verificar-logs-ci.mjs
      - name: Examinar serviços em caso de falha
        if: failure() && steps.privacidade.outcome != 'failure'
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Encerrar os serviços do teste
        if: always()
        run: docker compose down --volumes --remove-orphans
