name: Atualizar dependências do gerador de PDF

on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * 1'

permissions:
  contents: read

concurrency:
  group: atualizar-dependencias-danfse
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      mudou: ${{ steps.diff.outputs.mudou }}
    steps:
      - name: Obter a revisão aprovada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ler a versão fixada de Go
        id: pins
        run: echo "go=$(node scripts/verificar-distribuicao-danfse.mjs go-version)" >> "$GITHUB_OUTPUT"
      - name: Preparar Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false
      - name: Resolver os patches com os imports do projeto oficial
        run: bash scripts/atualizar-danfse.sh
      - name: Conferir se os módulos mudaram
        id: diff
        run: |
          if git diff --quiet -- deploy/danfse-go/go.mod deploy/danfse-go/go.sum; then
            echo 'mudou=false' >> "$GITHUB_OUTPUT"
          else
            echo 'mudou=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Recompilar a distribuição e conferir os contratos
        if: steps.diff.outputs.mudou == 'true'
        run: |
          bash scripts/compilar-danfse.sh
          npm ci --ignore-scripts --no-fund --no-audit
          node --test test/*.test.mjs
          tar -czf "$RUNNER_TEMP/atualizacao-danfse.tar.gz" deploy/danfse-go/go.mod deploy/danfse-go/go.sum public/engine public/danfse-integrity.mjs public/exemplo-danfse.pdf
      - name: Guardar a proposta de atualização
        if: steps.diff.outputs.mudou == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proposta-danfse
          path: ${{ runner.temp }}/atualizacao-danfse.tar.gz
          if-no-files-found: error
          retention-days: 7

  propor:
    needs: preparar
    if: needs.preparar.outputs.mudou == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Obter a revisão de origem da proposta
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publicar proposta e iniciar a homologação
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- mesa-fiscal:danfse-deps:v1 -->'
          pending=$(gh api --paginate --slurp 'repos/{owner}/{repo}/pulls?state=open&per_page=100' | jq -r --arg repo "$GH_REPO" 'flatten | map(select(.head.repo.full_name == $repo and (.head.ref | startswith("automation/danfse-patches-")))) | first | .head.ref // empty')
          if [[ -n "$pending" ]]; then
            [[ "$pending" =~ ^automation/danfse-patches-[0-9]+$ ]]
            gh workflow run official-engines.yml --ref "$pending"
            echo 'A proposta anterior aguarda revisão. A homologação foi iniciada novamente.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          issue=$(gh api --paginate --slurp 'repos/{owner}/{repo}/issues?state=open&per_page=100' | jq -c 'flatten | map(select(.pull_request == null and .user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- mesa-fiscal:danfse-deps:v1 -->")))) | first // empty')
          if [[ -n "$issue" ]]; then
            number=$(jq -r .number <<< "$issue")
            pending=$(jq -r '.body | capture("<!-- branch: (?<branch>automation/danfse-patches-[0-9]+) -->").branch' <<< "$issue")
            [[ "$pending" =~ ^automation/danfse-patches-[0-9]+$ ]]
            exists=$(gh api 'repos/{owner}/{repo}/git/matching-refs/heads/automation/danfse-patches-' | jq --arg branch "$pending" 'map(select(.ref == "refs/heads/" + $branch)) | length')
            if [[ "$exists" != 0 ]]; then
              relation=$(gh api "repos/{owner}/{repo}/compare/main...$pending" --jq .status)
              if [[ "$relation" = ahead || "$relation" = diverged ]]; then
                gh workflow run official-engines.yml --ref "$pending"
                printf '%s\n\n%s\n' 'A proposta anterior permanece aguardando revisão. A homologação foi iniciada novamente.' "Acompanhe a issue #$number." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            gh issue close "$number" --comment 'A branch de atualização foi incorporada, ficou para trás da main ou foi removida. A rotina pode preparar uma nova proposta.'
          fi
          gh run download "$GITHUB_RUN_ID" --name proposta-danfse --dir "$RUNNER_TEMP/proposta"
          tar -xzf "$RUNNER_TEMP/proposta/atualizacao-danfse.tar.gz"
          branch="automation/danfse-patches-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/danfse-go/go.mod deploy/danfse-go/go.sum public/engine public/danfse-integrity.mjs public/exemplo-danfse.pdf
          git commit -m 'Atualizar patches Go com as fontes oficiais e recompilar DANFSe'
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$branch"
          printf '%s\n\n%s\n' 'Atualiza os patches dos módulos Go resolvidos com o código-fonte oficial e regenera o WebAssembly, o runtime, as licenças, os hashes e o PDF fictício.' 'Os alvos HTTP e navegador compilaram. A homologação completa, com comparação dos bytes recompilados, govulncheck e cálculos fiscais, deve passar antes do merge.' > "$RUNNER_TEMP/descricao.md"
          # O dispatch explícito executa os checks mesmo sem uma PR criada.
          gh workflow run official-engines.yml --ref "$branch"
          if gh pr create --base main --head "$branch" --title 'Atualizar patches do gerador de PDF' --body-file "$RUNNER_TEMP/descricao.md" 2> "$RUNNER_TEMP/erro-pr.txt"; then
            echo 'PR publicada. Aguarda a homologação e a revisão antes de incorporar.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/erro-pr.txt" >&2
            if ! grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$RUNNER_TEMP/erro-pr.txt"; then
              exit 1
            fi
            compare="https://github.com/$GH_REPO/compare/main...$branch?expand=1"
            run="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            printf '%s\n\n<!-- branch: %s -->\n\n%s\n\n%s\n\n%s\n\n%s\n' "$marker" "$branch" 'Aguardando revisão. A resolução de patches com as fontes oficiais, as duas compilações e os testes locais passaram. A homologação completa foi iniciada na branch e deve passar antes da incorporação.' "[Revisar a comparação e abrir a PR]($compare)." "[Execução que preparou a proposta e artefato proposta-danfse]($run). O artefato fica disponível por sete dias e a branch preserva os arquivos preparados." 'A configuração atual do repositório impede GitHub Actions de criar PRs. A proposta pode ser aberta pelo mantenedor pelo link acima.' > "$RUNNER_TEMP/pendencia.md"
            gh issue create --title 'Revisar patches do gerador de PDF' --body-file "$RUNNER_TEMP/pendencia.md"
            printf '%s\n\n%s\n' 'Aguardando revisão. A criação automática de PRs está desligada e a proposta foi registrada em uma issue.' "Revisão e abertura manual da PR: $compare" >> "$GITHUB_STEP_SUMMARY"
          fi
